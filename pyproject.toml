[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-tracker-lite"
version = "0.1.0"
description = "A local SQLite experiment tracker for reproducible machine-learning runs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
experiment-tracker = "experiment_tracker.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
